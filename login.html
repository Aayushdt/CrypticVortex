<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evenly - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      :root {
        --primary: #2ecc71;
        --primary-dark: #27ae60;
        --primary-light: #a8f0c6;
        --primary-transparent: rgba(46, 204, 113, 0.1);
        --bg-light: #f8f9fa;
        --bg-dark: #1a1a1a;
        --card-light: #ffffff;
        --card-dark: #2d2d2d;
        --text-light: #333;
        --text-dark: #f5f5f5;
        --border-light: #e0e0e0;
        --border-dark: #444;
        --shadow-light: 0 8px 30px rgba(0, 0, 0, 0.1);
        --shadow-dark: 0 8px 30px rgba(0, 0, 0, 0.3);
        --transition: all 0.3s ease;
      }
      
      [data-theme="dark"] {
        --bg: var(--bg-dark);
        --card: var(--card-dark);
        --text: var(--text-dark);
        --border: var(--border-dark);
        --shadow: var(--shadow-dark);
      }
      
      [data-theme="light"] {
        --bg: var(--bg-light);
        --card: var(--card-light);
        --text: var(--text-light);
        --border: var(--border-light);
        --shadow: var(--shadow-light);
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }
      
      body {
        background-color: var(--bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text);
        transition: var(--transition);
      }
      
      .login-container {
        background: var(--card);
        padding: 40px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 450px;
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
        transition: var(--transition);
      }

      .login-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
      }
      
      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }
      
      .login-header h1 {
        color: var(--primary);
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 10px;
      }
      
      .login-header p {
        color: var(--text);
        opacity: 0.8;
        font-weight: 300;
      }
      
      .form-group {
        margin-bottom: 20px;
        position: relative;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--text);
        transition: var(--transition);
      }
      
      .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
        background-color: var(--card);
        color: var(--text);
        transition: var(--transition);
      }
      
      .form-group input:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 4px var(--primary-transparent);
      }
      
      .forgot-password {
        text-align: right;
        margin: 10px 0 25px;
      }
      
      .forgot-password a {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: var(--transition);
      }
      
      .forgot-password a:hover {
        text-decoration: underline;
      }
      
      .login-button {
        width: 100%;
        background: var(--primary);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        z-index: 1;
      }
      
      .login-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: 0.5s;
        z-index: -1;
      }
      
      .login-button:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(46, 204, 113, 0.3);
      }
      
      .login-button:hover::before {
        left: 100%;
      }
      
      .login-button:active {
        transform: translateY(0);
      }
      
      .login-footer {
        text-align: center;
        margin-top: 30px;
      }
      
      .login-footer p {
        color: var(--text);
        margin-bottom: 15px;
        font-size: 0.95rem;
      }
      
      .login-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
        transition: var(--transition);
      }
      
      .login-footer a:hover {
        text-decoration: underline;
      }
      
      .social-login {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 25px;
      }
      
      .social-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 25px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        transition: var(--transition);
        font-weight: 500;
      }
      
      .social-button:hover {
        background: var(--primary-transparent);
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      
      .back-to-site {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--text);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: var(--transition);
        font-weight: 500;
        font-size: 0.9rem;
      }
      
      .back-to-site:hover {
        color: var(--primary);
      }

      /* Theme Toggle */
      .theme-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        background: none;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-size: 1.2rem;
        transition: var(--transition);
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      
      .theme-toggle:hover {
        background: var(--primary-transparent);
        color: var(--primary);
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 30px 20px;
        }
        
        .login-header h1 {
          font-size: 1.7rem;
        }
        
        .social-login {
          flex-direction: column;
        }
        
        .social-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body data-theme="light">
    <a href="index.html" class="back-to-site">
      <i class="fas fa-arrow-left"></i> Back to website
    </a>
    
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon"></i>
    </button>
    
    <div class="login-container">
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your Evenly account</p>
      </div>
      
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        
        <div class="forgot-password">
          <a href="#">Forgot Password?</a>
        </div>
        
        <button type="button" class="login-button">Sign In</button>
      </form>
      
      <div class="login-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        
        <p style="margin-top: 20px; margin-bottom: 10px;">Or sign in with</p>
        
        <div class="social-login">
          <button class="social-button">
            <img src="src/assets/google.svg" alt="Google" width="24" height="24">
            Google
          </button>
          <button class="social-button">
            <img src="src/assets/apple.svg" alt="Apple" width="24" height="24">
            Apple
          </button>
        </div>
      </div>
    </div>
    
    <script>
      
      // Theme Toggle Functionality
      const themeToggle = document.getElementById('themeToggle');
      const body = document.body;
      let isDark = localStorage.getItem('theme') === 'dark';

      // Initialize theme
      function setTheme() {
        if (isDark) {
          body.setAttribute('data-theme', 'dark');
          themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
          localStorage.setItem('theme', 'dark');
        } else {
          body.setAttribute('data-theme', 'light');
          themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
          localStorage.setItem('theme', 'light');
        }
      }
      setTheme();

      themeToggle.addEventListener('click', () => {
        isDark = !isDark;
        setTheme();
        
        // Add a simple animation
        themeToggle.style.transform = 'scale(0.8)';
        setTimeout(() => {
          themeToggle.style.transform = 'scale(1)';
        }, 200);
      });

      // Simple login button functionality
      document.querySelector('.login-button').addEventListener('click', async function() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Add loading state to button
        const originalButtonText = this.innerHTML;
        this.innerHTML = '<span class="loading-spinner"></span> Signing in...';
        this.disabled = true;
        
        if(email && password) {
          try {
            // Check if this is a demo user from signup
            const demoUser = localStorage.getItem('demoUser');
            
            if (demoUser) {
              const userData = JSON.parse(demoUser);
              
              // Only allow login if email matches the demo user
              if (userData.email === email) {
                document.location.href = "CrypticVortex\cryptic.html";
                // Show success message
                const successMessage = document.createElement('div');
                successMessage.className = 'success-message';
                
                successMessage.innerHTML = `
                  <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                  </div>CrypticVortex\index.html
                  <h3>Demo Login Successful!</h3>
                  <p>Welcome back, ${userData.firstName}!</p>
                  <p>This is a demo. In a real app, you would be logged in and redirected to your dashboard.</p>
                `;
                
                // Add success message styles
                const style = document.createElement('style');
                style.textContent = `
                  .success-message {
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: var(--card);
                    padding: 30px;
                    border-radius: 16px;
                    box-shadow: var(--shadow);
                    text-align: center;
                    z-index: 1000;
                    border: 1px solid var(--border);
                    max-width: 90%;
                    width: 400px;
                  }
                  .success-message h3 {
                    color: var(--primary);
                    margin-bottom: 15px;
                    font-size: 1.5rem;
                  }
                  .success-message p {
                    margin-bottom: 10px;
                    color: var(--text);
                  }
                  .success-icon {
                    font-size: 4rem;
                    color: var(--primary);
                    margin-bottom: 20px;
                  }
                  .overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: rgba(0,0,0,0.5);
                    z-index: 999;
                  }
                  .loading-spinner {
                    display: inline-block;
                    width: 20px;
                    height: 20px;
                    border: 3px solid rgba(255,255,255,0.3);
                    border-radius: 50%;
                    border-top-color: #fff;
                    animation: spin 1s ease-in-out infinite;
                    margin-right: 8px;
                  }
                  @keyframes spin {
                    to { transform: rotate(360deg); }
                  }
                  .dashboard-btn {
                    display: inline-block;
                    background: var(--primary);
                    color: white;
                    border: none;
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-weight: 600;
                    margin-top: 20px;
                    cursor: pointer;
                    text-decoration: none;
                    transition: var(--transition);
                  }
                  .dashboard-btn:hover {
                    background: var(--primary-dark);
                  }
                `;
                document.head.appendChild(style);
                
                // Create overlay
                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                
                document.body.appendChild(overlay);
                document.body.appendChild(successMessage);
                
                // Add a "Go to Dashboard" button after a delay
                setTimeout(() => {
                  const dashboardBtn = document.createElement('a');
                  dashboardBtn.href = "index.html";
                  dashboardBtn.className = "dashboard-btn";
                  dashboardBtn.textContent = "Go to Homepage";
                  successMessage.appendChild(dashboardBtn);
                }, 2000);
                
                return;
              }
            }
            
            // Try actual API login for non-demo users
            try {
              const response = await fetch('http://localhost:5000/api/auth/login', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  email,
                  password
                  
                })
              });
              
              const data = await response.json();
              
              
              if (response.ok) {
                
                // Show success message
                const successMessage = document.createElement('div');
                successMessage.className = 'success-message';
                
                successMessage.innerHTML = `
                  <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                  </div>
                  <h3>Login Successful!</h3>
                  <p>Welcome back!</p>
                  <p>Redirecting to your dashboard...</p>
                `;
                document.location.href="cryptic.html";
                
                // Only create styles if they don't exist
                if (!document.querySelector('style')) {
                  const style = document.createElement('style');
                  style.textContent = `
                    .success-message {
                      position: fixed;
                      top: 50%;
                      left: 50%;
                      transform: translate(-50%, -50%);
                      background: var(--card);
                      padding: 30px;
                      border-radius: 16px;
                      box-shadow: var(--shadow);
                      text-align: center;
                      z-index: 1000;
                      border: 1px solid var(--border);
                      max-width: 90%;
                      width: 400px;
                    }
                    .success-message h3 {
                      color: var(--primary);
                      margin-bottom: 15px;
                      font-size: 1.5rem;
                    }
                    .success-message p {
                      margin-bottom: 10px;
                      color: var(--text);
                    }
                    .success-icon {
                      font-size: 4rem;
                      color: var(--primary);
                      margin-bottom: 20px;
                    }
                    .overlay {
                      position: fixed;
                      top: 0;
                      left: 0;
                      right: 0;
                      bottom: 0;
                      background: rgba(0,0,0,0.5);
                      z-index: 999;
                    }
                    .loading-spinner {
                      display: inline-block;
                      width: 20px;
                      height: 20px;
                      border: 3px solid rgba(255,255,255,0.3);
                      border-radius: 50%;
                      border-top-color: #fff;
                      animation: spin 1s ease-in-out infinite;
                      margin-right: 8px;
                    }
                    @keyframes spin {
                      to { transform: rotate(360deg); }
                    }
                  `;
                  document.head.appendChild(style);
                }
                
                // Create overlay
                const overlay = document.createElement('div');
                overlay.className = 'overlay';
                
                document.body.appendChild(overlay);
                document.body.appendChild(successMessage);
                
                // Store user token
                localStorage.setItem('userToken', data.token);
                
                // Redirect to dashboard after delay
                setTimeout(() => {
                  window.location.href = "index.html";
                }, 3000);
                
              } else {
                // Show error from actual API
                alert(`Error: ${data.message || 'Invalid credentials'}`);
                this.innerHTML = originalButtonText;
                this.disabled = false;
              }
            } catch (error) {
              console.error('Error during login:', error);
              
              // For demo, show failure message if email is not from demo signup
              alert('Login failed. Please check your credentials and try again.');
              this.innerHTML = originalButtonText;
              this.disabled = false;
            }
          } catch (error) {
            console.error('Error during login process:', error);
            
            // Reset button state
            this.innerHTML = originalButtonText;
            this.disabled = false;
            
            // Show error
            alert('Something went wrong. Please try again.');
          }
        } else {
          // Reset button state
          this.innerHTML = originalButtonText;
          this.disabled = false;
          
          // Show validation error
          alert('Please enter your email and password.');
        }
      });

      // Add ripple effect to buttons
      const buttons = document.querySelectorAll('.login-button, .social-button');
      buttons.forEach(button => {
        button.addEventListener('mousedown', function(e) {
          const x = e.clientX - this.getBoundingClientRect().left;
          const y = e.clientY - this.getBoundingClientRect().top;
          
          const ripple = document.createElement('span');
          ripple.style.cssText = `
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            width: 100px;
            height: 100px;
            left: ${x - 50}px;
            top: ${y - 50}px;
            transform: scale(0);
            opacity: 1;
            transition: transform 0.6s, opacity 0.6s;
          `;
          
          this.style.position = 'relative';
          this.style.overflow = 'hidden';
          this.appendChild(ripple);
          
          setTimeout(() => {
            ripple.style.transform = 'scale(4)';
            ripple.style.opacity = '0';
            setTimeout(() => {
              ripple.remove();
            }, 600);
          }, 10);
        });
      });
    </script>
  </body>
</html>
